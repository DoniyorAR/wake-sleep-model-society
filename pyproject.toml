[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsms"
version = "0.1.0"
description = "Wake-Sleep Model Society: a two-signal write rule for sleep-like memory consolidation in language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch", "transformers", "peft", "datasets", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["wsms*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
